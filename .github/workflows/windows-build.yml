name: Youngkly Windows build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Youngkly
        uses: actions/checkout@v4
        with:
          path: Youngkly
      - name: Checkout SI Generator
        uses: actions/checkout@v4
        with:
          repository: Skylark51/SIGenerator
          path: SIGenerator
      - name: Checkout Youngcraft
        uses: actions/checkout@v4
        with:
          repository: Skylark51/YoungCraft
          path: Youngcraft
      - name: Install MSYS2 and Qt
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-binutils
      - name: Configure
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          & C:/msys64/ucrt64/bin/cmake.exe -S Youngkly -B Youngkly/build -G Ninja `
            -DCMAKE_MAKE_PROGRAM=C:/msys64/ucrt64/bin/ninja.exe `
            -DCMAKE_CXX_COMPILER=C:/msys64/ucrt64/bin/g++.exe `
            -DCMAKE_PREFIX_PATH=C:/msys64/ucrt64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DSI_SOURCE_DIR="$env:GITHUB_WORKSPACE/SIGenerator/native" `
            -DYOUNGCRAFT_SOURCE_DIR="$env:GITHUB_WORKSPACE/Youngcraft"
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
      - name: Compile all targets
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          & C:/msys64/ucrt64/bin/cmake.exe --build Youngkly/build --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Core regression tests
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          & C:/msys64/ucrt64/bin/ctest.exe --test-dir Youngkly/build --output-on-failure -E render_controls
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed" }
      - name: Package single-file Windows executable
        shell: pwsh
        working-directory: Youngkly
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          & ./tools/package.ps1 -ToolRoot C:/ -BuildDirectory build -OutputPath outputs/package/Youngkly.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          if (-not (Test-Path outputs/package/Youngkly.exe)) { throw "Portable EXE missing" }
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Youngkly-Windows-portable
          path: Youngkly/outputs/package/Youngkly.exe
          if-no-files-found: error
